<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101317"><title>CHART QUEST — 차트 트레이닝 터미널</title><meta name="description" content="실제 과거 차트 10문제, 한 번의 결정. 3~12개월 리플레이와 추세추종 해설로 훈련하는 차트 터미널."><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tm-theme.css"><script src="tm-theme.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="/" data-tm-page="home"><span class="brand-icon">▥</span> CHART<span>QUEST</span></a><nav><a class="nav" href="/" data-tm-page="home" style="display:flex;align-items:center;text-decoration:none">홈</a><button class="nav active" id="train-nav">트레이닝</button><button class="nav" id="record-nav">세션 기록 <span id="record-count">0</span></button><button class="nav" id="scoreboard-nav">스코어보드</button><button class="nav" id="saved-nav">내 기록</button></nav><div id="account-controls" class="account-controls"></div></header>
<main>
<section class="session-strip"><div><span class="eyebrow">TREND FOLLOWING / SESSION 01</span><h1>TRAINING</h1></div><div class="session-numbers"><div><span>진행 상황</span><b><em id="completed">00</em><small> / 10</small></b></div><div><span>맞춘 개수</span><b><em id="total-score">0</em><small> / 10</small></b></div><div><span>나의 수익률</span><b id="session-return">—</b></div><div><span>정답률</span><b id="accuracy">—</b></div></div></section>
<div class="session-progress" id="session-progress" aria-label="10문제 진행 상황"></div>
<div id="error" role="alert" hidden></div>
<div class="training-stage"><section id="setup" class="start-overlay" aria-label="트레이닝 시작"><div class="start-card"><label class="horizon-label" for="horizon-months">매매 후 평가 기간</label><select id="horizon-months"><option value="3">+3개월</option><option value="6">+6개월</option><option value="9">+9개월</option><option value="12">+12개월</option></select><button class="primary" id="start-session" disabled>트레이닝 세션 시작하기</button><button class="secondary" id="fresh-session" hidden>새로 시작하기</button><button class="secondary" id="review-session" hidden>완료 세션 복습하기</button><p id="guest-quota" class="quota"></p><p id="setup-error" role="alert"></p><a id="quota-login" class="primary quota-login" href="/login?next=%2Ftraining" target="_top" hidden>로그인</a><button id="legacy-export" hidden>이전 기록 내보내기</button></div></section><div id="training-content" inert><p id="risk-summary" class="risk-summary" hidden></p><div class="workspace" id="workspace">
<section class="terminal" aria-label="차트 분석 터미널">
 <div class="terminal-head"><div><span class="case-badge" id="case-number">CASE 01 / 10</span><strong id="symbol">—</strong><span id="company"></span></div><span class="status" id="phase">● 판단 대기</span></div>
 <div class="quote-line"><span class="price" id="price">—</span><span id="quote-year" class="quote-year" hidden></span><span id="daily-change"></span><span class="quote-date" id="quote-date"></span><span class="unit">USD · 일봉 · 분할 조정</span></div>
 <div class="chart-toolbar"><div class="ma-controls" id="ma-controls"><span class="muted">SMA</span><button data-ma="10" style="--line:#e6c36b" aria-pressed="true">10</button><button data-ma="20" style="--line:#bb91ef" aria-pressed="true">20</button><button data-ma="50" style="--line:#5dabe9" aria-pressed="true">50</button><button data-ma="200" style="--line:#d2d7df" aria-pressed="true">200</button></div><div class="range"><button data-range="126" class="selected">6개월</button><button data-range="252">1년</button><button id="scale" aria-pressed="false">로그</button><button id="pivot" disabled aria-pressed="false">시각 해설</button></div></div>
 <section id="pattern-guide" class="pattern-guide" aria-label="이 차트의 학습 유형" hidden></section>
 <div class="canvas-wrap"><canvas id="chart" tabindex="0" aria-label="가격 캔들·이동평균·거래량 차트. 마우스를 올리거나 방향키로 공개된 봉의 가격을 확인하세요."></canvas><div class="chart-tip" id="tooltip" hidden></div></div>
 <div id="visual-legend" hidden></div><div class="chart-footer"><span><i class="green-dot"></i> Yahoo Finance · 실제 과거 시세</span><span id="chart-range"></span></div>
 <div class="replay-bar"><div class="replay-label"><span id="replay-icon">▸</span><div><b id="replay-title">판단 대기</b><span id="replay-sub"></span></div></div><div class="play-controls"><button id="pause" disabled aria-label="리플레이 일시정지">Ⅱ</button><button id="step" disabled aria-label="다음 거래일">▸│</button><select id="speed" aria-label="리플레이 속도"><option value="1">1× 속도</option><option value="3">3× 속도</option><option value="6">6× 속도</option></select></div></div><div class="replay-progress"><div id="replay-progress"></div></div>
</section>
<aside class="decision-panel">
 <div class="panel-label"><span>YOUR DECISION</span><span id="case-id">CQ-001</span></div>
 <section id="execution-notice" class="execution-notice" role="status" aria-live="polite" hidden></section><section id="decision"><h2>당신의 선택은?</h2><div class="decision-date"><span>판단 기준일</span><b id="decision-date">—</b></div><button class="trade buy" id="buy" disabled><span>↗ <b>BUY</b></span><span>상승 예상 <kbd>B</kbd></span></button><button class="trade wait" id="wait" disabled><span>→ <b>WAIT</b><small id="wait-count">5/5</small></span><span>10거래일 관망 <kbd>W</kbd></span></button><button class="trade sell" id="sell" disabled><span>— <b>PASS</b></span><span>진입 안 함 <kbd>P</kbd></span></button></section>
 <section id="remaining-decision" class="remaining-decision" hidden><h3>잔여 물량</h3><p id="remaining-quote"></p><div><button id="hold-remaining" class="secondary">잔량 보유</button><button id="sell-remaining" class="primary">잔량 매도</button></div></section><section id="position-value" class="position-value" aria-live="polite" hidden></section><section id="result" hidden aria-live="polite"></section>
 <section class="risk-panel" aria-labelledby="risk-title"><h2 id="risk-title">스탑 기준</h2><form id="settings-form"><div class="setting-row"><label><input type="checkbox" id="use-stop" checked> 고정 손절 사용</label><label>손절 폭 <input id="stop-pct" type="number" min="0.5" max="50" step="0.5" value="7" required> %</label></div><div class="setting-row"><label><input type="checkbox" id="use-trail"> BUY 트레일링 스탑</label><label>최고가 대비 <input id="trail-pct" type="number" min="0.5" max="50" step="0.5" value="10" disabled required> %</label></div><div class="setting-row"><label for="trail-sell-pct">전체 물량 중 청산 비중</label><label><input id="trail-sell-pct" type="number" min="1" max="100" step="1" value="100" disabled required> %</label></div><button class="secondary" id="apply-risk" type="submit">기준 적용</button><p id="risk-status" role="status"></p></form></section>
 <div class="panel-divider"></div><div class="learning-lock" id="learning-lock"><span class="lock-icon">⌑</span><div><b>차트 해설 잠김</b></div></div>
 </aside>
</div>
<section id="explanation" class="explanation" hidden></section>

</div></div></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="닫기">✕</button></div><div id="modal-body"></div></dialog>
<script type="module" src="app.js"></script>
</body></html>
