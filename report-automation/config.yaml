# ============================================================
#  설정 파일 — 메모장으로 열어서 고치면 됩니다
# ============================================================

# DART 인증키 (무료).  https://opendart.fss.or.kr  →  인증키 신청/관리 → 인증키 신청
# 신청하면 메일로 40자리 키가 옵니다.
# **이 파일에 적지 마십시오.** 이 파일은 저장소에 올라갑니다.
#   .env 에  DART_API_KEY=<키>  한 줄로 넣으십시오 (.env 는 안 올라갑니다).
dart_api_key: ""   # ← 비워 두십시오. 진짜 키는 .env 의 DART_API_KEY 에 있습니다

# 수집 범위
분기수: 12          # 재무제표를 몇 분기 가져올지
주가연수: 3         # 주가를 몇 년치 가져올지
피어수: 6           # 자동으로 잡을 피어그룹 최대 개수
공시조회일수: 180   # 최근 며칠간의 공시를 볼지

# 정기보고서 '본문'(사업의 내용·수주잔고·연구개발·소송/제재 등)까지 받을지.
# 재무제표 숫자만으로는 회사를 설명할 수 없으므로 켜두는 것을 권합니다.
# 원문이 커서 종목당 10~40초 정도 더 걸리고, 한 번 받으면 캐시에 남습니다.
공시본문수집: true

# SEC EDGAR (해외 종목용). 인증키는 필요 없고, 연락처만 예의상 적습니다.
sec_user_agent: ""  # SEC 자료 수집 전 본인 이름과 이메일 입력

# 증권사 리포트 PDF 를 넣어둘 폴더 (이 파일 기준 상대경로)
리포트폴더: "입력_리포트PDF"

# 산업 보고서 PDF 를 넣어둘 폴더 — 장중에 여기 올려두면 산업리포트를 따로 만듭니다
산업리포트폴더: "입력_산업리포트PDF"

# 작업 우선순위: 보유 종목 먼저, 그다음 관심 종목
우선순위: ["보유", "관심"]

# ------------------------------------------------------------
# 피어그룹 직접 지정 (선택)
#   자동 선정이 마음에 안 들면 여기에 적습니다. 여기 적으면 자동 선정은 하지 않습니다.
#   국내는 "종목코드 회사이름", 해외는 회사 이름만 적으면 됩니다.
#   (해외 피어는 수치를 자동으로 못 채우므로 보고서에서 참고용으로만 쓰입니다)
# ------------------------------------------------------------
peers:
  # 해외는 티커로 적습니다
  "MXL":
    - "SWKS"
    - "QRVO"
    - "SLAB"
    - "CRUS"
  "119850":
    - "112610 씨에스윈드"
    - "298040 효성중공업"
    - "Cummins"
    - "Caterpillar"
    - "Kawasaki Heavy Industries"

# ------------------------------------------------------------
# 보고서 기본값
# ------------------------------------------------------------
보고서:
  작성자: "TradingManager"
  면책문구: "본 보고서는 개인의 투자 판단을 돕기 위한 자료이며, 특정 종목의 매매를 권유하지 않습니다."
  통화단위: "억원"

# 컨퍼런스콜 대상 — 미국 시총 상위 100 (2026-09-14 사용자 지시)
#  주식 종류가 A·B·C 로 나뉜 회사는 SEC 공시만으로 주식수를 합칠 수 없어 시가총액이
#  안 나옵니다. 빼놓을 수 없는 곳은 여기에 적어 순위 없이 대상에 넣습니다.
#  (한국투자증권 키를 넣으면 KIS 가 시가총액을 바로 주므로 이 목록이 필요 없어집니다)
# 2026-09-14 KIS 키가 들어온 뒤 다시 봤더니 HSY·STZ·ARES·ERIE 는 그냥 100위 밖이고,
# V 는 17위로 제자리를 찾았습니다. 남는 것은 표기가 특수한 둘뿐입니다.
미국_항상포함: [BRKB, BFB]
