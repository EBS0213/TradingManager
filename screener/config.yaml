# ══════════════════════════════════════════════════════════════
#  스크리닝 기준 설정  —  이 파일의 숫자만 고치면 됩니다
#  (# 으로 시작하는 줄은 설명이라 프로그램이 무시합니다)
# ══════════════════════════════════════════════════════════════

# ── 데이터 공급원 ────────────────────────────────────────────
# auto  : KRX 계정이 있으면 pykrx, 없으면 네이버 (권장)
# naver : 항상 네이버 금융
# pykrx : 항상 KRX (환경변수 KRX_ID / KRX_PW 필요)
data_source: auto

# ── 업종 분류 ────────────────────────────────────────────────
# krx   : 한국거래소 KIND 상장법인목록 = 통계청 표준산업분류(KSIC). 공식 기준 (권장)
# naver : 네이버 금융 업종 (FnGuide 계열, 테마성이 강함)
# both  : KRX 를 기본으로 쓰되 빠진 종목만 네이버로 보충
sector_source: krx

# ── 대상 시장 ────────────────────────────────────────────────
markets: [KOSPI, KOSDAQ]

# ── Trend Template 8개 조건 ──────────────────────────────────
rs_min: 70              # ⑧ RS 순위 몇 점 이상을 통과로 볼지 (미너비니 기준 70)
above_52w_low: 1.30     # ⑥ 52주 최저가 대비 +30% 이상  (1.30 = +30%)
below_52w_high: 0.75    # ⑦ 52주 최고가 대비 -25% 이내  (0.75 = -25%)

# ── 걸러낼 종목 ──────────────────────────────────────────────
min_price: 1000               # 이 가격 미만은 제외 (동전주)
min_trade_value: 500000000    # 20일 평균 거래대금 5억 미만 제외
exclude_spac: true            # 스팩 제외
exclude_etf_etn: true         # ETF·ETN·리츠 제외

# ── 실적 조건 ────────────────────────────────────────────────
use_fundamentals: true        # false 로 하면 실적 확인을 아예 건너뜁니다 (더 빠름)
eps_growth_min: 0.20          # 직전 분기 EPS 증가율 20% 이상
sales_growth_min: 0.15        # 직전 분기 매출 증가율 15% 이상
fundamentals_as_filter: true  # true=미달 종목 탈락 / false=표시만 하고 통과 유지
pass_when_unknown: true       # 실적을 못 가져온 종목을 통과시킬지 (true 권장)

# ── 수급 / 매집 ──────────────────────────────────────────────
accumulation_days: 50         # UD비율·매집일을 볼 기간(거래일). 미너비니식 기관 매집 판단
use_supply: true              # 외국인·기관 20일 순매수 확인 (한국 시장 전용)
supply_as_filter: false       # true=외인·기관 동반 이탈이면 탈락 / false=표시만 (권장)

# 실적·수급을 확인할 종목의 문턱 (2026-08-26)
#  0  = 전 종목. 조건을 하나도 못 채운 종목도 실적·수급이 채워집니다.
#       "지금은 자리가 아니어도 회사는 어떤지 보고 싶다" 는 용도입니다.
#  6  = 예전 기본값. 6개 이상 통과한 종목만 확인했습니다.
#  전 종목이어도 받아 둔 값을 다시 씁니다(data/cache_실적.csv · cache_수급.csv).
#   · 실적은 90일, 수급은 1일이 지나야 새로 받습니다.
#   · 그래서 **첫 실행만** 오래 걸립니다(수 분). 그다음부터는 하루 한 번 수급만.
extra_min_conds: 0

# ── 진입 참고 ────────────────────────────────────────────────
max_stop_pct: 0.08            # 손절가 제안 시 최대 손절폭 (미너비니 상한 8%)

# ── 차트 ─────────────────────────────────────────────────────
spark_days: 60                # 결과 파일에 담을 주가 이력 일수 (대시보드 선형차트용, 0=끄기)
spark_only_candidates: true   # true면 7개 이상 통과·관심종목만 담음 (파일이 작아집니다)

# ── VCP 참고 지표 ────────────────────────────────────────────
vcp_base_weeks: 8             # 최근 몇 주를 베이스로 볼지 (피벗가격 기준 구간)

# ── 실행 ─────────────────────────────────────────────────────
only_during_market: false     # true 로 하면 장 시간(09:00~15:30)에만 실행
request_delay: 0.10           # 서버 요청 간격(초). 너무 줄이면 차단될 수 있습니다
max_workers: 12               # 동시 접속 수. 12~16 권장, 너무 올리면 차단됩니다
